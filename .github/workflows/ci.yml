name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests infra/lambda
      - run: PYTHONPATH=src pytest -q

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.web -t painel-pericial-web:ci .
      - run: docker build -f Dockerfile.worker -t painel-pericial-worker:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format and show diff
        run: |
          terraform fmt -recursive infra
          git diff -- infra
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false && terraform validate
      - name: Validate application stack
        working-directory: infra/terraform
        run: terraform init -backend=false && terraform validate
