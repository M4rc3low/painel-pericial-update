name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  PROJECT_NAME: painel-pericial

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          WEB="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$PROJECT_NAME-web:$GITHUB_SHA"
          WORKER="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$PROJECT_NAME-worker:$GITHUB_SHA"
          docker build -f Dockerfile.web -t "$WEB" .
          docker build -f Dockerfile.worker -t "$WORKER" .
          docker push "$WEB"
          docker push "$WORKER"

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=painel-pericial/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Validate production security inputs
        if: ${{ inputs.environment == 'prod' }}
        run: |
          test -n "${{ vars.ACM_CERTIFICATE_ARN }}" || (echo "ACM_CERTIFICATE_ARN is required for prod" && exit 1)
          test -n "${{ vars.APP_FQDN }}" || (echo "APP_FQDN is required for prod" && exit 1)

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
          APP_FQDN: ${{ vars.APP_FQDN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          OPS_EMAIL: ${{ vars.OPS_EMAIL }}
        run: |
          args=(-var-file="${{ inputs.environment }}.tfvars" -var="image_tag=$GITHUB_SHA")
          if [ "${{ inputs.environment }}" = "prod" ]; then
            args+=( -var="certificate_arn=$ACM_CERTIFICATE_ARN" -var="app_fqdn=$APP_FQDN" )
            if [ -n "$HOSTED_ZONE_ID" ]; then args+=( -var="hosted_zone_id=$HOSTED_ZONE_ID" ); fi
          fi
          if [ -n "$OPS_EMAIL" ]; then args+=( -var="ops_email=$OPS_EMAIL" ); fi
          terraform plan "${args[@]}" -out=tfplan

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan
