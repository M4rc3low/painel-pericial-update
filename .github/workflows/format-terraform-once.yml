name: Format Terraform Once

on:
  push:
    branches:
      - "agent/cloud-modernization-case"

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive infra
      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- infra; then
            echo "No Terraform formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra
          git commit -m "Format Terraform configuration"
          git push
